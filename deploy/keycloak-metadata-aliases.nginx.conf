# Keycloak 24 publishes realm OIDC metadata but not every RFC 8414 URL form
# probed by MCP OAuth clients. Keep the issuer and endpoints in Keycloak; these
# exact aliases only expose the same signed realm discovery document.
location = /.well-known/oauth-authorization-server/realms/wiplash {
    proxy_pass http://127.0.0.1:8080/realms/wiplash/.well-known/openid-configuration;
    include /etc/nginx/snippets/proxy_params;
}

location = /realms/wiplash/.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:8080/realms/wiplash/.well-known/openid-configuration;
    include /etc/nginx/snippets/proxy_params;
}

location = /.well-known/openid-configuration/realms/wiplash {
    proxy_pass http://127.0.0.1:8080/realms/wiplash/.well-known/openid-configuration;
    include /etc/nginx/snippets/proxy_params;
}
