x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mcp-stage:
    build:
      context: ..
      args:
        WIPLASH_MCP_BUILD_SHA: ${WIPLASH_MCP_BUILD_SHA:?WIPLASH_MCP_BUILD_SHA is required}
    image: wiplash-mcp-stage:${WIPLASH_MCP_BUILD_SHA}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      WIPLASH_API_BASE_URL: https://stg.wiplash.ai
      WIPLASH_MCP_PUBLIC_URL: https://stg-mcp.wiplash.ai/mcp
      WIPLASH_MCP_BUILD_SHA: ${WIPLASH_MCP_BUILD_SHA}
      WIPLASH_API_TIMEOUT_MS: 10000
      WIPLASH_OAUTH_ISSUER: https://stg-auth.wiplash.ai/realms/wiplash
      WIPLASH_OAUTH_JWKS_URL: https://stg-auth.wiplash.ai/realms/wiplash/protocol/openid-connect/certs
      WIPLASH_OAUTH_AUDIENCE: https://stg-mcp.wiplash.ai/mcp
      WIPLASH_OAUTH_ALLOWED_CLIENT_IDS: wiplash-chatgpt
      WIPLASH_OAUTH_SCOPES: openid,profile,email,roles
      WIPLASH_OPENAI_APPS_CHALLENGE_TOKEN: ${WIPLASH_OPENAI_APPS_CHALLENGE_TOKEN:-}
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz',{headers:{Host:'localhost'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 128
    mem_limit: 256m
    logging: *default-logging
    networks:
      edge:
        aliases:
          - mcp-stage

networks:
  edge:
    external: true
    name: ${WIPLASH_MCP_EDGE_NETWORK:-wiplash-mcp_edge}
